<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Surprise Finale</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --rose:#d94f79; --deep-rose:#a92c57; --lavender:#ae8cc8; --cream:#fff8eb; --ink:#6d2548; }
    * { box-sizing: border-box; }
    html { background: #fff3f3; }
    body { width: 100%; min-height: 100vh; margin: 0; overflow-x: hidden; color: var(--ink); font-family: "Alegreya Sans", sans-serif; }
    .dream-page {
      position: relative; width: 100%; min-height: 100vh; overflow: hidden;
      display: flex; align-items: center; justify-content: center; padding: 2.25rem 1rem;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.92) 0 3%, transparent 22%),
        radial-gradient(circle at 88% 20%, rgba(231,186,219,.65) 0 4%, transparent 25%),
        linear-gradient(135deg, #fff4e9 0%, #fde7ef 45%, #eee4f8 100%);
    }
    @media (min-width: 640px) { .dream-page { padding: 3rem 1.75rem; } }
    .glow { position: absolute; border-radius: 999px; filter: blur(7px); opacity: .54; pointer-events: none; animation: drift 9s ease-in-out infinite alternate; }
    .glow-one { width: 17rem; height: 17rem; top: -6rem; left: -4rem; background: #ffc1d5; }
    .glow-two { width: 18rem; height: 18rem; right: -7rem; bottom: -7rem; background: #cbb1e7; animation-delay: -4s; }
    .sparkle { position: absolute; width: 10px; height: 10px; background: #fffdf5; transform: rotate(45deg); box-shadow: 0 0 14px 4px rgba(255,255,255,.9); opacity: .9; animation: twinkle 2.6s ease-in-out infinite; pointer-events: none; }
    .s1 { top: 12%; left: 10%; } .s2 { top: 24%; right: 12%; animation-delay: .9s; } .s3 { bottom: 20%; left: 12%; animation-delay: 1.8s; } .s4 { bottom: 12%; right: 18%; animation-delay: .4s; }
    .float-heart { position: absolute; color: #de5e87; opacity: .5; pointer-events: none; animation: floatUp linear infinite; text-shadow: 0 4px 16px rgba(186,53,99,.22); }
    .heart-a { left: 6%; bottom: -2rem; font-size: 1.75rem; animation-duration: 12s; }
    .heart-b { left: 20%; bottom: -3rem; font-size: 1.1rem; animation-duration: 15s; animation-delay: -5s; }
    .heart-c { right: 10%; bottom: -2rem; font-size: 2.1rem; animation-duration: 14s; animation-delay: -7s; }
    .heart-d { right: 28%; bottom: -2rem; font-size: 1.25rem; animation-duration: 11s; animation-delay: -2s; }
    .heart-e { left: 45%; bottom: -4rem; font-size: 1.5rem; animation-duration: 16s; animation-delay: -9s; }
    .love-card {
      position: relative; width: min(92%, 760px); margin: 0 auto; text-align: center; padding: 2rem 1.25rem;
      border: 1px solid rgba(255,255,255,.83); border-radius: 2rem; background: rgba(255,251,247,.66);
      box-shadow: 0 24px 70px rgba(142,57,95,.17), inset 0 1px 0 rgba(255,255,255,.85);
      backdrop-filter: blur(13px); animation: revealCard .8s cubic-bezier(.2,.8,.2,1) both;
    }
    @media (min-width: 640px) { .love-card { padding: 2.5rem; } }
    .eyebrow { margin: 0 0 .75rem; text-transform: uppercase; }
    .heading-font { font-family: "Playfair Display", serif; }
    .title-line { display: inline-flex; align-items: center; gap: .55rem; position: relative; margin: 0; }
    .title-line::after { content: ""; position: absolute; height: 2px; width: 54%; left: 23%; bottom: -.65rem; border-radius: 99px; background: linear-gradient(90deg, transparent, #df7194, transparent); }
    .illustration-wrap { margin-top: 2.25rem; }
    .illustration-shell {
      position: relative; max-width: 480px; margin: 0 auto; border-radius: 1.45rem; overflow: hidden;
      background: linear-gradient(150deg, #f7d4e3, #f6e6d9 52%, #ded0f0);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.65), 0 16px 30px rgba(123,61,92,.1);
    }
    .illustration-shell::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.68) 1px, transparent 1px); background-size: 18px 18px; opacity: .52; pointer-events: none; }
    .illustration-shell svg { position: relative; z-index: 10; display: block; width: 100%; }
    .shayari-section { margin-top: 1.75rem; }
    .shayari-section h2 { margin: 0; }
    .shayari { max-width: 590px; margin: 0 auto; line-height: 1.75; text-wrap: balance; }
    .rose-divider { width: 5rem; height: 1px; margin: 1.15rem auto; background: linear-gradient(90deg, transparent, #df7194, transparent); }
    .button-section { margin-top: 2rem; }
    .forever-button {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .65rem; min-width: 190px;
      border: 0; border-radius: 999px; padding: .9rem 1.6rem; cursor: pointer;
      box-shadow: 0 10px 22px rgba(183,48,101,.28), 0 0 0 0 rgba(226,92,135,.34);
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease; animation: buttonPulse 2.5s ease-in-out infinite;
    }
    .forever-button svg { width: 20px; height: 20px; fill: currentColor; stroke-width: 2.4; }
    .forever-button:hover { transform: translateY(-3px) scale(1.025); box-shadow: 0 15px 30px rgba(183,48,101,.34), 0 0 0 9px rgba(226,92,135,.1); filter: saturate(1.08); }
    .forever-button:active { transform: translateY(1px) scale(.98); }
    .forever-button:focus-visible { outline: 3px solid #88416e; outline-offset: 4px; }
    .reveal-panel { display: grid; grid-template-rows: 0fr; opacity: 0; transform: translateY(12px); transition: grid-template-rows .55s ease, opacity .5s ease, transform .55s ease; }
    .reveal-panel > div { overflow: hidden; }
    .reveal-panel.is-visible { grid-template-rows: 1fr; opacity: 1; transform: translateY(0); }
    .reveal-inner { min-height: 0; margin-top: 0; border-radius: 1.15rem; background: rgba(255,226,235,.66); border: 1px solid rgba(220,106,145,.19); padding: 1rem 1.25rem; }
    .reveal-panel.is-visible .reveal-inner { margin-top: 1.25rem; }
    .reveal-hearts { margin-bottom: .25rem; font-size: 1.125rem; color: #d8527c; }
    .reveal-inner p { margin: 0; }
    .burst-heart { display: inline-block; animation: heartDance 1.3s ease-in-out infinite alternate; }
    .burst-heart:nth-child(2) { animation-delay: .22s; } .burst-heart:nth-child(3) { animation-delay: .45s; }
    @keyframes revealCard { from{opacity:0; transform:translateY(24px) scale(.975);} to{opacity:1; transform:translateY(0) scale(1);} }
    @keyframes drift { from{transform:translate(0,0) scale(1);} to{transform:translate(28px,18px) scale(1.13);} }
    @keyframes twinkle { 0%,100%{opacity:.22; transform:rotate(45deg) scale(.65);} 50%{opacity:1; transform:rotate(45deg) scale(1.15);} }
    @keyframes floatUp { 0%{transform:translateY(0) rotate(0deg) scale(.8); opacity:0;} 12%{opacity:.55;} 85%{opacity:.35;} 100%{transform:translateY(-115vh) rotate(28deg) scale(1.35); opacity:0;} }
    @keyframes buttonPulse { 0%,100%{box-shadow:0 10px 22px rgba(183,48,101,.28), 0 0 0 0 rgba(226,92,135,.25);} 50%{box-shadow:0 12px 26px rgba(183,48,101,.34), 0 0 0 8px rgba(226,92,135,0);} }
    @keyframes heartDance { from{transform:translateY(0) rotate(-7deg) scale(.9);} to{transform:translateY(-7px) rotate(8deg) scale(1.13);} }
    @media (max-width: 480px) { .love-card { border-radius: 1.5rem; } .illustration-shell { border-radius: 1.1rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body style="background:linear-gradient(135deg, rgb(255,244,233) 0%, rgb(253,231,239) 45%, rgb(238,228,248) 100%);">
  <main class="dream-page">
    <div class="glow glow-one"></div><div class="glow glow-two"></div>
    <span class="sparkle s1" aria-hidden="true"></span><span class="sparkle s2" aria-hidden="true"></span><span class="sparkle s3" aria-hidden="true"></span><span class="sparkle s4" aria-hidden="true"></span>
    <span class="float-heart heart-a" aria-hidden="true">♥</span><span class="float-heart heart-b" aria-hidden="true">♡</span><span class="float-heart heart-c" aria-hidden="true">♥</span><span class="float-heart heart-d" aria-hidden="true">♡</span><span class="float-heart heart-e" aria-hidden="true">♥</span>
    <section class="love-card" aria-labelledby="love-heading">
      <header>
        <p class="eyebrow" style="color:rgb(170,77,114); font-weight:700; font-size:15px; letter-spacing:.12rem;">सिर्फ़ तुम्हारे लिए</p>
        <h1 id="love-heading" class="heading-font title-line" style="color:rgb(169,44,87); font-weight:800; font-size:42px; line-height:1.1;">I LOVE YOU 💖</h1>
      </header>
      <section class="illustration-wrap" aria-label="लैला और मजनू का प्रेम चित्र">
        <div class="illustration-shell">
          <svg viewBox="0 0 600 360" role="img" aria-label="पारंपरिक पोशाक में प्यार से एक-दूसरे को देखते लैला और मजनू का प्यारा कार्टून चित्र">
            <defs>
              <linearGradient id="sky" x1="0" x2="1"><stop offset="0%" stop-color="#f6c9d8"/><stop offset="100%" stop-color="#d9c7ed"/></linearGradient>
              <linearGradient id="scarf" x1="0" x2="1"><stop offset="0%" stop-color="#bd3d6c"/><stop offset="100%" stop-color="#e77fa0"/></linearGradient>
              <linearGradient id="kurta" x1="0" x2="1"><stop offset="0%" stop-color="#a74363"/><stop offset="100%" stop-color="#d86c86"/></linearGradient>
            </defs>
            <rect width="600" height="360" fill="url(#sky)"/>
            <circle cx="106" cy="72" r="44" fill="#fff6dd" opacity=".8"/>
            <path d="M0 282 C95 232 138 260 222 238 C305 216 371 249 460 226 C530 208 570 217 600 222 L600 360 L0 360Z" fill="#d5b8d8" opacity=".55"/>
            <path d="M0 297 C86 270 147 304 231 271 C319 237 372 288 458 256 C523 232 567 249 600 243 L600 360 L0 360Z" fill="#aa779d" opacity=".32"/>
            <g fill="#fffaf1" opacity=".86">
              <path d="M112 123c-8-12-28-2-13 13l13 11 13-11c15-15-5-25-13-13z"/>

            </g>
            <g transform="translate(112,80)">
              <path d="M55 57 C29 54 17 80 26 126 L48 169 L158 169 L174 113 C183 77 157 56 134 58Z" fill="url(#scarf)"/>
              <path d="M61 82 C47 120 47 147 43 174 L145 174 C138 133 149 113 139 81Z" fill="#ed9ab1"/>

              <path d="M84 44 C84 19 100 9 116 10 C145 12 152 41 144 57 C139 36 128 27 112 27 C98 27 89 34 84 44Z" fill="#43283a"/>
              <circle cx="103" cy="53" r="3" fill="#3c2430"/>

              <path d="M105 71 Q114 77 123 70" fill="none" stroke="#a5485e" stroke-width="3" stroke-linecap="round"/>
              <circle cx="112" cy="62" r="2" fill="#d94f79"/>
              <path d="M78 34 Q98 19 133 31" fill="none" stroke="#e4b157" stroke-width="4" stroke-linecap="round"/>
              <circle cx="107" cy="27" r="5" fill="#e4b157"/>
              <path d="M59 94 Q21 122 12 163" fill="none" stroke="#c9846e" stroke-width="14" stroke-linecap="round"/>
              <path d="M151 100 Q176 121 188 143" fill="none" stroke="#c9846e" stroke-width="14" stroke-linecap="round"/>
            </g>
            <g transform="translate(324,83)">
              <path d="M43 177 C44 119 54 75 98 67 C139 60 172 105 172 177Z" fill="url(#kurta)"/>
              <path d="M81 78 C83 55 94 39 114 39 C139 39 151 58 146 83 C141 105 130 116 111 115 C91 113 80 100 81 78Z" fill="#b87360"/>
              <path d="M79 77 C66 58 70 21 99 10 C129 -2 157 18 151 56 C141 38 133 27 113 27 C96 27 85 43 79 77Z" fill="#30263a"/>
              <path d="M82 65 C78 39 96 20 116 21 C143 22 154 44 147 70 C141 51 132 39 113 39 C98 39 87 51 82 65Z" fill="#443043"/>
              <circle cx="102" cy="76" r="3" fill="#38232c"/>
              <circle cx="128" cy="76" r="3" fill="#38232c"/>
              <path d="M106 93 Q115 101 124 93" fill="none" stroke="#8e3e54" stroke-width="3" stroke-linecap="round"/>
              <path d="M92 69 Q102 65 108 70 M122 70 Q129 65 137 69" fill="none" stroke="#38232c" stroke-width="3" stroke-linecap="round"/>
              <path d="M53 105 Q24 127 8 153" fill="none" stroke="#b87360" stroke-width="14" stroke-linecap="round"/>
              <path d="M160 108 Q186 125 202 148" fill="none" stroke="#b87360" stroke-width="14" stroke-linecap="round"/>
              <path d="M87 117 L141 117" stroke="#edc863" stroke-width="4" opacity=".8"/>
            </g>
            <path d="M258 236 C271 218 300 230 300 250 C300 230 329 218 342 236 C355 255 324 276 300 292 C276 276 245 255 258 236Z" fill="#df527c" opacity=".94"/>
            <g fill="#fff6df"><circle cx="289" cy="268" r="3"/><circle cx="312" cy="267" r="3"/><circle cx="301" cy="280" r="3"/></g>
          </svg>
        </div>
      </section>
      <section class="shayari-section" aria-labelledby="shayari-heading">
        <h2 id="shayari-heading" class="heading-font" style="color:rgb(176,68,110); font-weight:700; font-size:22px;">दिल की बात</h2>
        <div class="rose-divider" aria-hidden="true"></div>
        <p class="shayari" style="color:rgb(109,37,72); font-weight:700; font-size:21px;">लैला-मजनू सा किस्सा नहीं चाहिए, बस तेरा मेरा साथ चाहिए। तू मुस्कुरा दे तो खिल उठे मेरी दुनिया, मुझे हर जन्म में बस तेरा हाथ चाहिए।</p>
      </section>
      <section class="button-section" aria-label="प्रेम संदेश खोलें">
        <button id="forever-button" class="forever-button" type="button" aria-expanded="false" aria-controls="love-reveal" style="background:linear-gradient(135deg, rgb(217,79,121), rgb(169,44,87)); color:rgb(255,250,245);">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span style="color:rgb(255,250,245); font-weight:700; font-size:19px;">Forever 💞</span>
        </button>
        <div id="love-reveal" class="reveal-panel" aria-live="polite">
          <div>
            <div class="reveal-inner">
              <div class="reveal-hearts" aria-hidden="true"><span class="burst-heart">♥</span> <span class="burst-heart">♥</span> <span class="burst-heart">♥</span></div>
              <p class="heading-font" style="color:rgb(159,49,93); font-weight:700; font-size:22px; line-height:1.35;">तुम ही मेरी आख़िरी और सबसे प्यारी मंज़िल हो 💕</p>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script>
    (function () {
      var button = document.getElementById("forever-button");
      var reveal = document.getElementById("love-reveal");
      button.addEventListener("click", function () {
        var isVisible = reveal.classList.toggle("is-visible");
        button.setAttribute("aria-expanded", String(isVisible));
        if (isVisible) reveal.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    })();
  </script>
</body>
</html>
