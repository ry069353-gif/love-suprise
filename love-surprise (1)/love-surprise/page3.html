<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Page Three</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    :root { --rose:#e84d79; --deep-rose:#b92f5d; --lavender:#b89adf; --cream:#fff8ed; --ink:#6b2947; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 100%; min-height: 100vh; overflow-x: hidden; font-family: "DM Sans", sans-serif; color: var(--ink);
      background: linear-gradient(135deg, rgb(255,247,237) 0%, rgb(253,227,235) 46%, rgb(238,225,250) 100%);
      transition: opacity 600ms ease;
    }
    body.leaving { opacity: 0; }
    .romance-shell { position: relative; width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; overflow: hidden; isolation: isolate; }
    .romance-shell::before, .romance-shell::after {
      content: ""; position: absolute; width: 34rem; height: 34rem; border-radius: 999px; filter: blur(20px);
      opacity: .48; z-index: -2; animation: drift 10s ease-in-out infinite alternate;
    }
    .romance-shell::before { background: rgba(244,151,181,.62); top: -15rem; left: -12rem; }
    .romance-shell::after { background: rgba(184,154,223,.5); bottom: -16rem; right: -12rem; animation-delay: -4s; }
    .heart-field { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
    .heart { position: absolute; display: block; color: rgba(214,61,111,.42); filter: drop-shadow(0 0 10px rgba(236,91,142,.28)); animation: floatHeart var(--speed) ease-in-out infinite; animation-delay: var(--delay); }
    .heart:nth-child(1) { left: 7%; top: 13%; font-size: 2rem; --speed: 8s; --delay: -2s; }
    .heart:nth-child(2) { left: 17%; bottom: 12%; font-size: 1.3rem; --speed: 7s; --delay: -5s; }
    .heart:nth-child(3) { right: 9%; top: 15%; font-size: 2.2rem; --speed: 9s; --delay: -1s; }
    .heart:nth-child(4) { right: 17%; bottom: 14%; font-size: 1.45rem; --speed: 7.5s; --delay: -3s; }
    .heart:nth-child(5) { left: 37%; top: 7%; font-size: 1.25rem; --speed: 6.5s; --delay: -4s; }
    .heart:nth-child(6) { right: 34%; bottom: 7%; font-size: 1.55rem; --speed: 8.5s; --delay: -6s; }
    .love-card {
      position: relative; width: min(100%, 780px); padding: clamp(2.5rem,7vw,5.5rem) clamp(1.5rem,7vw,5rem); text-align: center;
      border: 1px solid rgba(255,255,255,.8); border-radius: 2.5rem; background: rgba(255,252,249,.68);
      box-shadow: 0 26px 70px rgba(126,45,81,.17), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(16px); animation: enterCard 900ms cubic-bezier(.2,.9,.2,1) both;
    }
    .love-card::before { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(211,88,131,.14); border-radius: 2rem; pointer-events: none; }
    .eyebrow { display: inline-flex; align-items: center; gap: .5rem; color: #a93c63; text-transform: uppercase; font-weight: 700; margin: 0 0 1.4rem; }
    .title-wrap { position: relative; display: inline-block; margin: 0 auto; }
    .love-title {
      margin: 0; font-family: "Playfair Display", serif; line-height: 1.04; letter-spacing: -.055em;
      background: linear-gradient(120deg, #bd2d5d 5%, #f26f9a 48%, #a66bc9 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent !important;
      animation: titleGlow 3s ease-in-out infinite;
    }
    .title-heart { position: absolute; right: -1.4rem; top: -1.3rem; color: #ed5d8d; animation: heartbeat 1.7s ease-in-out infinite; }
    .shayari-text { max-width: 590px; margin: 2rem auto 2.3rem; font-family: "Playfair Display", serif; font-style: italic; line-height: 1.85; color: #74334e; }
    .love-button {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .65rem; min-width: 190px;
      padding: 1rem 1.8rem; border: 0; border-radius: 999px; box-shadow: 0 12px 26px rgba(201,47,95,.32); cursor: pointer;
      transition: transform 220ms ease, box-shadow 220ms ease, filter 220ms ease;
    }
    .love-button:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 17px 33px rgba(201,47,95,.4); filter: saturate(1.08); }
    .love-button:active { transform: translateY(1px) scale(.98); }
    .love-button:focus-visible { outline: 3px solid #8c5bb9; outline-offset: 5px; }
    .love-button svg { width: 20px; height: 20px; fill: currentColor; stroke-width: 2.4; animation: heartbeat 1.4s ease-in-out infinite; }
    .reveal-card {
      max-height: 0; margin: 0 auto; overflow: hidden; opacity: 0; transform: translateY(18px) scale(.97); border-radius: 1.6rem;
      background: linear-gradient(135deg, rgba(255,234,241,.92), rgba(244,231,255,.92));
      transition: max-height 700ms ease, opacity 600ms ease, transform 650ms cubic-bezier(.2,.9,.2,1), margin-top 650ms ease, padding 650ms ease;
    }
    .revealed .reveal-card { max-height: 300px; opacity: 1; transform: translateY(0) scale(1); margin-top: 1.4rem; padding: 1.35rem 1.2rem; }
    .reveal-inner { position: relative; padding: 1.3rem 1rem; border-radius: 1.2rem; border: 1px solid rgba(219,86,133,.2); }
    .reveal-title { margin: 0 0 .6rem; font-family: "Playfair Display", serif; color: #af315d; }
    .reveal-message { margin: 0; line-height: 1.65; color: #7f3d58; }
    .sparkle-field { position: absolute; inset: 0; pointer-events: none; }
    .sparkle { position: absolute; color: #e95f91; opacity: 0; font-size: 1.15rem; animation: sparkle 1.7s ease-in-out infinite; }
    .revealed .sparkle { opacity: 1; }
    .sparkle:nth-child(1) { top: .5rem; left: 8%; animation-delay: .1s; }
    .sparkle:nth-child(2) { right: 10%; top: 1.1rem; animation-delay: .5s; }
    .sparkle:nth-child(3) { left: 18%; bottom: .45rem; animation-delay: .9s; }
    .sparkle:nth-child(4) { right: 20%; bottom: .35rem; animation-delay: 1.2s; }
    .hidden-button { pointer-events: none; opacity: 0; transform: translateY(10px) scale(.96); max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; transition: all 350ms ease; }
    @keyframes floatHeart { 0%,100%{transform:translate3d(0,0,0) rotate(-8deg);} 50%{transform:translate3d(10px,-24px,0) rotate(10deg);} }
    @keyframes drift { from{transform:translate3d(0,0,0) scale(1);} to{transform:translate3d(40px,25px,0) scale(1.12);} }
    @keyframes enterCard { from{opacity:0; transform:translateY(24px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
    @keyframes titleGlow { 0%,100%{filter:drop-shadow(0 0 4px rgba(239,116,158,.18));} 50%{filter:drop-shadow(0 0 15px rgba(239,116,158,.42));} }
    @keyframes heartbeat { 0%,100%{transform:scale(1);} 18%{transform:scale(1.2);} 35%{transform:scale(.98);} 52%{transform:scale(1.12);} }
    @keyframes sparkle { 0%,100%{transform:scale(.55) rotate(0deg); opacity:.3;} 50%{transform:scale(1.2) rotate(90deg); opacity:1;} }
    @media (max-width: 520px) {
      .romance-shell { padding: 1rem; } .love-card { border-radius: 2rem; }
      .title-heart { right: -.65rem; top: -1rem; } .shayari-text { line-height: 1.7; }
      .love-title { font-size: 46px !important; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="romance-shell" aria-labelledby="love-title">
    <div class="heart-field" aria-hidden="true"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></div>
    <section id="love-card" class="love-card">
      <p class="eyebrow" style="color:rgb(169,60,99); font-size:12px; letter-spacing:.12rem;">सिर्फ़ तुम्हारे लिए</p>
      <div class="title-wrap">
        <h1 id="love-title" class="love-title" style="font-weight:700; font-size:72px; letter-spacing:-.05rem; line-height:1.05;">I LOVE YOU 💖</h1>
        <span class="title-heart" aria-hidden="true">♥</span>
      </div>
      <p class="shayari-text" style="font-weight:600; font-size:20px; line-height:1.8;">तेरे बिना अधूरी सी हर खुशी लगती है, तेरे साथ ही ज़िंदगी पूरी लगती है। तू पास रहे तो हर पल प्यार बन जाए, तेरी मुस्कान से मेरी दुनिया संवर जाए।</p>
      <button id="next-button" class="love-button" type="button" aria-controls="reveal-card" aria-expanded="false" style="background:linear-gradient(135deg, rgb(217,52,106) 0%, rgb(241,116,160) 55%, rgb(182,111,208) 100%); color:#fff;">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        <span style="color:#fff; font-weight:700; font-size:18px;">Next 💕</span>
      </button>
      <section id="reveal-card" class="reveal-card" aria-live="polite">
        <div class="reveal-inner">
          <div class="sparkle-field" aria-hidden="true"><span class="sparkle">✦</span><span class="sparkle">✧</span><span class="sparkle">✦</span><span class="sparkle">✧</span></div>
          <h2 class="reveal-title" style="font-weight:700; font-size:27px; line-height:1.2;">मेरे दिल की सबसे प्यारी बात</h2>
          <p class="reveal-message" style="font-weight:600; font-style:italic; font-size:19px; line-height:1.6;">I love you… और ये प्यार हमेशा रहेगा 💞</p>
        </div>
      </section>
    </section>
  </main>
  <script>
    (function () {
      var button = document.getElementById("next-button");
      var card = document.getElementById("love-card");
      var reveal = document.getElementById("reveal-card");
      var clicked = false;
      button.addEventListener("click", function () {
        if (clicked) return;
        clicked = true;
        card.classList.add("revealed");
        button.classList.add("hidden-button");
        button.setAttribute("aria-expanded", "true");
        // message padhne ke liye thoda ruk ke agla page (page4) khulega
        setTimeout(function () { document.body.classList.add("leaving"); }, 2200);
        setTimeout(function () { window.location.href = "page4.html"; }, 2800);
      });
    })();
  </script>
</body>
</html>
