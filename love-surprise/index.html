<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Surprise</title>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root { --wine:#7d2649; --rose:#d84876; --blush:#f9d9df; --lavender:#e7dcf2; --cream:#fff8ed; --gold:#d99c6b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 100%; min-height: 100vh; overflow-x: hidden;
      font-family: "Alegreya", serif; color: var(--wine);
      background: linear-gradient(135deg, rgb(255,247,236) 0%, rgb(251,224,229) 48%, rgb(233,221,242) 100%);
      transition: opacity 600ms ease;
    }
    body.leaving { opacity: 0; }
    .love-shell {
      width: 100%; min-height: 100vh; position: relative; isolation: isolate; overflow: hidden;
      display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem;
    }
    .love-shell::before, .love-shell::after {
      content: ""; position: absolute; pointer-events: none; z-index: -1; border-radius: 999px; filter: blur(4px);
    }
    .love-shell::before {
      width: 34rem; height: 34rem; top: -15rem; left: -12rem;
      background: radial-gradient(circle, rgba(241,149,181,.52), rgba(241,149,181,0) 68%);
      animation: drift 12s ease-in-out infinite alternate;
    }
    .love-shell::after {
      width: 36rem; height: 36rem; bottom: -18rem; right: -14rem;
      background: radial-gradient(circle, rgba(185,150,214,.42), rgba(185,150,214,0) 68%);
      animation: drift 15s ease-in-out infinite alternate-reverse;
    }
    .romance-card {
      width: min(100%, 46rem); position: relative;
      padding: clamp(2.2rem,6vw,4.8rem) clamp(1.5rem,7vw,5.5rem); text-align: center;
      border: 1px solid rgba(255,255,255,.78); border-radius: 2.1rem;
      background: rgba(255,253,247,.64);
      box-shadow: 0 2rem 5rem rgba(125,38,73,.16), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(12px);
      animation: arrive 850ms cubic-bezier(.2,.8,.2,1) both;
    }
    .romance-card::before, .romance-card::after {
      position: absolute; color: rgba(216,72,118,.35); font-size: 2rem; line-height: 1;
    }
    .romance-card::before { content: "✿"; top: 1.25rem; left: 1.4rem; transform: rotate(-18deg); }
    .romance-card::after { content: "❀"; right: 1.45rem; bottom: 1.25rem; transform: rotate(18deg); }
    .eyebrow-wrap { display:flex; align-items:center; justify-content:center; gap:.7rem; margin-bottom:1.25rem; }
    .eyebrow-wrap::before, .eyebrow-wrap::after {
      content: ""; height: 1px; width: clamp(2rem,8vw,4rem);
      background: linear-gradient(to right, transparent, rgba(216,72,118,.65));
    }
    .eyebrow-wrap::after { transform: scaleX(-1); }
    .eyebrow { font-family: "Playfair Display", serif; letter-spacing: .04em; margin: 0; }
    .main-message { font-family: "Playfair Display", serif; line-height: 1.22; margin: 0 auto; max-width: 34rem; text-wrap: balance; }
    .shayari {
      max-width: 33rem; margin: 1.8rem auto 2.1rem; padding: 1.15rem 1.35rem;
      border-top: 1px solid rgba(216,72,118,.18); border-bottom: 1px solid rgba(216,72,118,.18);
      font-size: clamp(1.08rem,2.5vw,1.35rem); line-height: 1.55; font-style: italic;
    }
    .button-stage { min-height: 4.2rem; display: flex; align-items: center; justify-content: center; }
    .love-button {
      position: relative; border: 0; border-radius: 999px; padding: .15rem; cursor: pointer;
      box-shadow: 0 .85rem 1.65rem rgba(198,49,100,.27);
      transition: transform 220ms ease, box-shadow 220ms ease, opacity 260ms ease;
      animation: buttonGlow 2.8s ease-in-out infinite;
    }
    .love-button:hover, .love-button:focus-visible {
      transform: translateY(-4px) scale(1.025); box-shadow: 0 1.2rem 2.2rem rgba(198,49,100,.38); outline: none;
    }
    .love-button:active { transform: translateY(-1px) scale(.98); }
    .love-button-inner {
      min-width: 11.7rem; display: flex; align-items: center; justify-content: center; gap: .55rem;
      padding: .88rem 1.6rem; border-radius: inherit; background: rgba(255,255,255,.12); font-size: 1.26rem; line-height: 1;
    }
    .love-button .button-heart { width: 1.1rem; height: 1.1rem; stroke-width: 2.4; animation: heartbeat 1.35s ease-in-out infinite; }
    .floating-heart, .particle { position: absolute; pointer-events: none; z-index: -1; }
    .particle {
      width: .45rem; height: .45rem; border-radius: 50%; background: rgba(255,255,255,.84);
      box-shadow: 0 0 1rem rgba(255,255,255,.9); animation: twinkle 3s ease-in-out infinite;
    }
    .floating-heart { color: rgba(216,72,118,.45); font-size: clamp(1rem,2.7vw,1.7rem); animation: floatUp 7s ease-in-out infinite; }
    .heart-a { left: 8%; top: 18%; animation-delay: -1s; }
    .heart-b { right: 11%; top: 25%; animation-delay: -3.2s; color: rgba(147,100,178,.48); }
    .heart-c { left: 15%; bottom: 12%; animation-delay: -5.1s; color: rgba(220,101,140,.38); }
    .heart-d { right: 17%; bottom: 11%; animation-delay: -2.2s; }
    .p-a { left: 20%; top: 11%; animation-delay: -1s; }
    .p-b { right: 21%; top: 12%; animation-delay: -2.5s; }
    .p-c { left: 7%; bottom: 26%; animation-delay: -.5s; }
    .p-d { right: 8%; bottom: 30%; animation-delay: -3.5s; }
    .burst-heart { position: fixed; z-index: 5; pointer-events: none; color: #d84876; font-size: 1.3rem; animation: burst 1.25s ease-out forwards; }
    @keyframes arrive { from { opacity:0; transform: translateY(20px) scale(.97);} to { opacity:1; transform: translateY(0) scale(1);} }
    @keyframes drift { from { transform: translate(0,0) scale(1);} to { transform: translate(4rem,2rem) scale(1.15);} }
    @keyframes heartbeat { 0%,100%{transform:scale(1);} 15%{transform:scale(1.16);} 30%{transform:scale(1);} 45%{transform:scale(1.1);} }
    @keyframes buttonGlow { 0%,100%{box-shadow:0 .85rem 1.65rem rgba(198,49,100,.27);} 50%{box-shadow:0 .95rem 2.4rem rgba(198,49,100,.42);} }
    @keyframes floatUp { 0%,100%{transform:translateY(0) rotate(-6deg); opacity:.3;} 50%{transform:translateY(-1.4rem) rotate(8deg); opacity:.75;} }
    @keyframes twinkle { 0%,100%{transform:scale(.6); opacity:.35;} 50%{transform:scale(1.25); opacity:1;} }
    @keyframes burst {
      from { transform: translate(-50%,-50%) scale(.6) rotate(0deg); opacity: 1; }
      to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.45) rotate(40deg); opacity: 0; }
    }
    @media (max-width: 480px) {
      .love-shell { padding: 1rem; }
      .romance-card { border-radius: 1.65rem; }
      .shayari { padding-inline: .8rem; }
      .main-message { font-size: 30px !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="love-shell" aria-labelledby="main-message">
    <span class="floating-heart heart-a" aria-hidden="true">♥</span>
    <span class="floating-heart heart-b" aria-hidden="true">♥</span>
    <span class="floating-heart heart-c" aria-hidden="true">♥</span>
    <span class="floating-heart heart-d" aria-hidden="true">♥</span>
    <span class="particle p-a" aria-hidden="true"></span>
    <span class="particle p-b" aria-hidden="true"></span>
    <span class="particle p-c" aria-hidden="true"></span>
    <span class="particle p-d" aria-hidden="true"></span>

    <section class="romance-card" aria-label="रोमांटिक सरप्राइज़">
      <div class="eyebrow-wrap">
        <p class="eyebrow" style="color:rgb(163,61,99); font-weight:600; font-size:18px;">एक छोटा सा सरप्राइज़</p>
      </div>
      <h1 id="main-message" class="main-message" style="color:rgb(125,38,73); font-weight:700; font-size:36px;">अभी तो ये शुरुआत है… Next करो, सरप्राइज़ बाकी है 💖</h1>
      <p class="shayari" style="color:rgb(140,70,99); font-weight:500; font-size:18px;">तेरी मुस्कान से रोशन मेरी हर शाम रहे, तेरे साथ मेरा हर ख्वाब तमाम रहे। अभी तो बस शुरुआत है इस प्यार की, आगे हर पल तेरा नाम रहे।</p>
      <div class="button-stage">
        <button id="next-button" class="love-button" type="button" style="background:linear-gradient(135deg, rgb(228,79,127), rgb(189,47,97)); color:#fff;">
          <span class="love-button-inner">
            <svg class="button-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            <span style="color:#fff; font-weight:700; font-size:20px;">Next 💕</span>
          </span>
        </button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var nextButton = document.getElementById("next-button");
      var clicked = false;

      function createHeartBurst() {
        var box = nextButton.getBoundingClientRect();
        var originX = box.left + box.width / 2;
        var originY = box.top + box.height / 2;
        for (var i = 0; i < 13; i++) {
          var heart = document.createElement("span");
          var angle = (Math.PI * 2 * i) / 13;
          var distance = 65 + Math.random() * 85;
          heart.className = "burst-heart";
          heart.textContent = i % 3 === 0 ? "💖" : "♥";
          heart.style.left = originX + "px";
          heart.style.top = originY + "px";
          heart.style.setProperty("--x", Math.cos(angle) * distance + "px");
          heart.style.setProperty("--y", Math.sin(angle) * distance + "px");
          document.body.appendChild(heart);
          heart.addEventListener("animationend", function () { this.remove(); });
        }
      }

      nextButton.addEventListener("click", function () {
        if (clicked) return;
        clicked = true;
        createHeartBurst();
        // heart burst dikhne ke baad page fade hoke dusra page khulega
        setTimeout(function () { document.body.classList.add("leaving"); }, 650);
        setTimeout(function () { window.location.href = "page2.html"; }, 1250);
      });
    })();
  </script>
</body>
</html>
