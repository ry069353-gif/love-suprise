<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letter Page 2</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root { --rose:#df4c76; --rose-deep:#b72f5a; --blush:#f9d8df; --cream:#fff8ee; --lavender:#d8c3ec; --ink:#6a2942; }
    * { box-sizing: border-box; }
    html { width: 100%; }
    body {
      width: 100%; margin: 0; min-height: 100vh; overflow-x: hidden; font-family: "DM Sans", sans-serif;
      background: linear-gradient(135deg, rgb(255,248,238) 0%, rgb(253,235,240) 48%, rgb(238,226,245) 100%); transition: opacity 600ms ease;
    }
    body.leaving { opacity: 0;
    }
    .romance-shell {
      width: 100%; min-height: 100vh; position: relative; isolation: isolate;
      display: flex; align-items: center; justify-content: center; padding: 3rem 1.25rem; overflow: hidden;
    }
    .romance-shell::before, .romance-shell::after {
      content: ""; position: absolute; border-radius: 999px; pointer-events: none; z-index: -1; filter: blur(8px); opacity: .75;
    }
    .romance-shell::before {
      width: 23rem; height: 23rem; background: radial-gradient(circle, rgba(241,139,169,.52), rgba(241,139,169,0));
      top: -8rem; left: -7rem; animation: drift 9s ease-in-out infinite alternate;
    }
    .romance-shell::after {
      width: 28rem; height: 28rem; background: radial-gradient(circle, rgba(187,155,218,.46), rgba(187,155,218,0));
      right: -11rem; bottom: -12rem; animation: drift 11s ease-in-out infinite alternate-reverse;
    }
    .sparkle {
      position: absolute; width: .55rem; height: .55rem; border-radius: 999px; background: rgba(255,255,255,.86);
      box-shadow: 0 0 18px 5px rgba(255,255,255,.55); animation: twinkle 2.8s ease-in-out infinite; pointer-events: none;
    }
    .sparkle-one { top: 14%; left: 13%; }
    .sparkle-two { top: 20%; right: 16%; animation-delay: .8s; }
    .sparkle-three { bottom: 18%; left: 18%; animation-delay: 1.6s; }
    .love-letter-panel {
      width: min(100%, 760px); position: relative;
      padding: clamp(2.5rem,6vw,4.8rem) clamp(1.35rem,6vw,5.5rem);
      border: 1px solid rgba(255,255,255,.72); border-radius: 2.4rem;
      box-shadow: 0 30px 80px rgba(131,42,73,.18), inset 0 1px 0 rgba(255,255,255,.75);
      text-align: center; animation: panelEnter .9s cubic-bezier(.22,.8,.25,1) both; overflow: hidden;
      background: linear-gradient(145deg, rgba(255,255,255,.86), rgba(255,240,242,.73));
    }
    .love-letter-panel::before {
      content: "♥"; position: absolute; top: 1.25rem; right: 1.7rem; font-family: "Playfair Display", serif;
      font-size: 3.4rem; color: rgba(205,77,119,.11); transform: rotate(12deg); pointer-events: none;
    }
    .hero-letter-wrap {
      position: relative; display: inline-flex; justify-content: center; align-items: center;
      min-width: 10rem; min-height: 12rem; margin-bottom: 1.2rem;
    }
    .heart-halo {
      position: absolute; width: 10rem; height: 10rem; border-radius: 48% 48% 45% 45%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(249,147,177,.38) 38%, rgba(220,82,124,.08) 68%, transparent 70%);
      filter: blur(1px); animation: haloPulse 3s ease-in-out infinite;
    }
    .heart-halo::before, .heart-halo::after {
      content: "♥"; position: absolute; color: rgba(222,72,116,.32); font-family: "Playfair Display", serif;
      filter: drop-shadow(0 0 12px rgba(219,62,110,.3));
    }
    .heart-halo::before { font-size: 2rem; top: .55rem; left: .45rem; transform: rotate(-14deg); }
    .heart-halo::after { font-size: 1.25rem; right: .45rem; bottom: 1rem; transform: rotate(14deg); }
    .hero-letter {
      position: relative; z-index: 1; margin: 0; font-family: "Playfair Display", serif;
      font-size: clamp(9rem,26vw,14.5rem) !important; font-weight: 600; line-height: .76; letter-spacing: -.11em;
      background: linear-gradient(145deg, #ffa9bf 0%, #dd3e70 44%, #a72c59 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent !important;
      filter: drop-shadow(0 10px 15px rgba(193,55,101,.25)); animation: letterFloat 4.2s ease-in-out infinite;
    }
    .ornament { display:flex; align-items:center; justify-content:center; gap:.7rem; margin-bottom:1.25rem; color:#c84d72; animation: fadeUp .8s .2s both; }
    .ornament-line { width: 3.5rem; height: 1px; background: linear-gradient(90deg, transparent, rgba(190,64,103,.64)); }
    .ornament-line:last-child { background: linear-gradient(90deg, rgba(190,64,103,.64), transparent); }
    .love-shayari {
      max-width: 590px; margin: 0 auto; font-family: "Playfair Display", serif; line-height: 1.85;
      white-space: pre-line; animation: fadeUp .9s .32s both;
    }
    .next-button {
      margin-top: 2.3rem; min-width: min(100%, 15rem); display: inline-flex; align-items: center; justify-content: center;
      gap: .65rem; border: 0; border-radius: 999px; padding: 1rem 1.65rem; cursor: pointer;
      box-shadow: 0 13px 28px rgba(193,52,97,.3), inset 0 1px 0 rgba(255,255,255,.38);
      transition: transform 220ms ease, box-shadow 220ms ease, filter 220ms ease;
      animation: fadeUp .9s .46s both, softGlow 2.5s ease-in-out infinite;
    }
    .next-button:hover { transform: translateY(-4px) scale(1.025); filter: saturate(1.08); box-shadow: 0 18px 34px rgba(181,44,88,.38), inset 0 1px 0 rgba(255,255,255,.4); }
    .next-button:active { transform: translateY(1px) scale(.97); }
    .next-button:focus-visible { outline: 3px solid #8f4a92; outline-offset: 5px; }
    .next-button svg { width: 1.2rem; height: 1.2rem; fill: currentColor; stroke-width: 2.4; }
    .reveal-panel {
      max-height: 0; margin-top: 0; opacity: 0; overflow: hidden; transform: translateY(12px);
      transition: max-height 700ms ease, margin-top 600ms ease, opacity 500ms ease, transform 600ms ease;
      background: linear-gradient(135deg, rgb(255,225,233) 0%, rgb(244,221,241) 100%); border-radius: 1.3rem;
    }
    .reveal-panel.is-visible { max-height: 12rem; margin-top: 1.9rem; opacity: 1; transform: translateY(0); }
    .reveal-inner { padding: 1.15rem 1.2rem; border-radius: 1.3rem; border: 1px solid rgba(231,110,148,.25); box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }
    .reveal-message { margin: 0; font-family: "Playfair Display", serif; line-height: 1.45; }
    .heart-burst {
      position: fixed; left: 50%; bottom: -2rem; z-index: 20; font-size: 1.5rem; pointer-events: none;
      animation: floatHeart 3.6s cubic-bezier(.16,.7,.27,1) forwards; filter: drop-shadow(0 4px 5px rgba(183,40,90,.18));
    }
    @keyframes panelEnter { from { opacity:0; transform: translateY(22px) scale(.975);} to { opacity:1; transform: translateY(0) scale(1);} }
    @keyframes fadeUp { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform: translateY(0);} }
    @keyframes letterFloat { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-8px) rotate(1deg);} }
    @keyframes haloPulse { 0%,100%{transform:scale(.92); opacity:.68;} 50%{transform:scale(1.1); opacity:1;} }
    @keyframes softGlow {
      0%,100%{ box-shadow: 0 13px 28px rgba(193,52,97,.28), inset 0 1px 0 rgba(255,255,255,.38); }
      50%{ box-shadow: 0 15px 35px rgba(222,67,116,.45), 0 0 0 8px rgba(241,128,162,.09), inset 0 1px 0 rgba(255,255,255,.38); }
    }
    @keyframes drift { from { transform: translate3d(0,0,0) scale(1);} to { transform: translate3d(2.2rem,1.6rem,0) scale(1.08);} }
    @keyframes twinkle { 0%,100%{transform:scale(.55); opacity:.35;} 50%{transform:scale(1.2); opacity:1;} }
    @keyframes floatHeart {
      0% { opacity:0; transform: translate(-50%,0) scale(.5) rotate(0deg); }
      12% { opacity:1; }
      100% { opacity:0; transform: translate(calc(-50% + var(--drift)), -100vh) scale(1.35) rotate(var(--turn)); }
    }
    @media (max-width: 480px) {
      .romance-shell { padding: 1.35rem .9rem; }
      .love-letter-panel { border-radius: 1.8rem; }
      .love-shayari { line-height: 1.72; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="romance-shell" aria-label="प्रेम संदेश">
    <span class="sparkle sparkle-one" aria-hidden="true"></span>
    <span class="sparkle sparkle-two" aria-hidden="true"></span>
    <span class="sparkle sparkle-three" aria-hidden="true"></span>
    <section class="love-letter-panel" aria-labelledby="hero-letter">
      <div class="hero-letter-wrap" aria-hidden="true">
        <span class="heart-halo"></span>
        <h1 id="hero-letter" class="hero-letter">I</h1>
      </div>
      <div class="ornament" aria-hidden="true"><span class="ornament-line"></span><span>♥</span><span class="ornament-line"></span></div>
      <p class="love-shayari" style="color:rgb(106,41,66); font-weight:500; font-size:21px;">इश्क़ की राहों में तेरा साथ चाहिए, हर जन्म में बस तेरा हाथ चाहिए।
तू मिले तो दुनिया पूरी लगती है, मेरी हर खुशी को तेरा नाम चाहिए।</p>
      <button id="next-button" class="next-button" type="button" aria-controls="reveal-panel" aria-expanded="false" style="background:linear-gradient(135deg, rgb(244,126,156) 0%, rgb(216,61,110) 55%, rgb(183,47,90) 100%); color:#fff;">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        <span style="color:#fff; font-weight:700; font-size:17px;">Next 💕</span>
      </button>
      <section id="reveal-panel" class="reveal-panel" aria-live="polite" aria-hidden="true">
        <div class="reveal-inner">
          <p class="reveal-message" style="color:rgb(158,49,91); font-weight:600; font-size:22px;">मेरे दिल की सबसे प्यारी वजह तुम हो 💖</p>
        </div>
      </section>
    </section>
  </main>

  <script>
    (function () {
      var nextButton = document.getElementById("next-button");
      var revealPanel = document.getElementById("reveal-panel");
      var hasRevealed = false;

      function createFloatingHearts() {
        var hearts = ["♥", "💗", "💕", "💖", "♥", "💞"];
        hearts.forEach(function (heart, index) {
          var p = document.createElement("span");
          p.className = "heart-burst";
          p.textContent = heart;
          p.style.left = (20 + Math.random() * 60) + "%";
          p.style.animationDelay = (index * 110) + "ms";
          p.style.setProperty("--drift", ((Math.random() * 18) - 9) + "rem");
          p.style.setProperty("--turn", ((Math.random() * 120) - 60) + "deg");
          p.style.color = index % 2 === 0 ? "#df4c76" : "#b762a2";
          document.body.appendChild(p);
          setTimeout(function () { p.remove(); }, 4100);
        });
      }

      nextButton.addEventListener("click", function () {
        if (!hasRevealed) {
          revealPanel.classList.add("is-visible");
          revealPanel.setAttribute("aria-hidden", "false");
          nextButton.setAttribute("aria-expanded", "true");
          hasRevealed = true;
          // message dikhne ke baad agla page (page3) khulega
          setTimeout(function () { document.body.classList.add("leaving"); }, 2000);
          setTimeout(function () { window.location.href = "page3.html"; }, 2600);
        }
        createFloatingHearts();
      });
    })();
  </script>
</body>
</html>
